<!doctype html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link href="/src/style.css" rel="stylesheet">
    </head>
    <body class="bg-gray-100  min-h-screen flex items-center justify-center">

        <main>
            <meta charset="UTF-8" />
            <meta name="viewport"
                content="width=device-width, initial-scale=1.0" />
            <title>Mock Interview Feedback</title>
            <script src="https://cdn.tailwindcss.com"></script>
        </main>
        <section
            class="bg-gray-100 min-h-screen flex items-center justify-center">
            <div class="bg-white w-full max-w-3xl mx-auto rounded overflow-hidden">

               
                <div class="bg-amber-500 h-32"></div>

                <div class="bg-white w-full max-w-3xl mx-auto p-6 ">

                    <h1 class="text-2xl text-amber-600 font-medium">Feedback
                        from
                        for mock interview session</h1>
                    <p class="mb-4">Please fill up the feedback form</p>

                    <form class>
                        <div>
                            <p class="mb-2 text-md font-medium">1. How do you
                                rate
                                the overall mock
                                interview session?</p>

                            <!-- radio button -->
                            <div class="flex flex-col gap-2 mb-3">
                                <label>
                                    <input type="radio" name="quality"
                                        class="accent-orange-400">
                                    Excellent
                                </label>
                                <label>
                                    <input type="radio" name="quality"
                                        class="accent-orange-400">
                                    Very good
                                </label>
                                <label>
                                    <input type="radio" name="quality"
                                        class="accent-orange-400">
                                    Good
                                </label>
                                <label>
                                    <input type="radio" name="quality"
                                        class="accent-orange-400">
                                    Ok
                                </label>
                                <label>
                                    <input type="radio" name="quality"
                                        class="accent-orange-400">
                                    Not Happy
                                </label>
                            </div>

                        </div>

                        <div>
                            <p class="mb-2 text-md font-medium">2. Was the
                                interview
                                helpful?</p>

                            <!-- radio button -->
                            <div class="flex flex-col gap-2 mb-3">
                                <label>
                                    <input type="radio" name="quality"
                                        class="accent-orange-400">
                                    Very Helpful
                                </label>
                                <label>
                                    <input type="radio" name="quality"
                                        class="accent-orange-400">
                                    Somewhat Helpful
                                </label>
                                <label>
                                    <input type="radio" name="quality"
                                        class="accent-orange-400">
                                    Not Helpful
                                </label>
                                <label>
                                    <input type="radio" name="quality"
                                        class="accent-orange-400">
                                    Needs more explanation
                                </label>

                            </div>

                        </div>

                        <div class="mb-2">
                            <p class="font-medium mb-2">
                                3. Would you recommend this session to others?
                            </p>
                            <div class>
                                <label class="flex items-center gap-2">
                                    <input type="radio" name="recommend"
                                        class="accent-orange-400">
                                    Yes
                                </label>
                                <label class="flex items-center gap-2">
                                    <input type="radio" name="recommend"
                                        class="accent-orange-400">
                                    No
                                </label>
                                <label class="flex items-center gap-2">
                                    <input type="radio" name="recommend"
                                        class="accent-orange-400">
                                    Maybe
                                </label>
                            </div>
                        </div>

                        <p class="mb-2 text-md font-medium">4. Would you like to
                            provide your feedback ?</p>

                        <div class=" bg-white border rounded ">

                            <textarea id="textArea"
                                class=" w-full"
                                rows="5"
                                placeholder="Type your feedback here..."
                                oninput="countCharacters()">
                        </textarea>

                        </div>

                        <div class="mb-6">
                            <p> <span id="charCount"> </span></p>
                        </div>

                    </form>

                    <button
                        class="bg-orange-500 text-white text-md font-medium rounded px-1 py-2 items-center w-40">Submit
                        Form</button>

                </section>

                <script src="./char-count.js"></script>
            </body>
        </html>
