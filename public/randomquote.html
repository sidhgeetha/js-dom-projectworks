                <button
                    id="inspiration"
                    class="border cursor-pointer text-slate-300 px-2 rounded-full min-w-[130px] h-8 text-center font-light text-nowrap hover:bg-green-400 hover:text-slate-800">
                    Inspiration
                </button>
                <button
                    id="philosophy"
                    class="border  text-slate-300 px-2 rounded-full min-w-[130px] h-8  text-center font-light text-nowrap hover:bg-purple-300 hover:text-slate-800">
                    Philosophy
                </button>
                <button
                    id="happy"
                    class="border text-slate-300 px-2  rounded-full min-w-[130px] h-8  text-center font-light text-nowrap hover:bg-yellow-300 hover:text-slate-800">
                    Happy
                </button>
                <button
                    id="love"
                    class="border text-slate-300 px-2   rounded-full min-w-[130px] h-8  text-center font-light text-nowrap hover:bg-red-500 hover:text-slate-800">
                    Love
                </button>
                <button
                    id="lesson"
                    class="border text-slate-300 px-2  rounded-full min-w-[130px] h-8  text-center font-light text-nowrap hover:bg-blue-300 hover:text-slate-800">
                    Life Lessons
                </button>
                <button
                    id="new-quote"
                    class="bg-rose-400 px-2 py-2  text-md  font-medium rounded-full w-full text-nowrap hover:bg-purple-300 hover:text-slate-800 ">
                    New Quote
                </button>

        <main class="max-w-7xl min-h-screen mt-12 mx-auto items-center">
            <div class="text-center text-5xl font-bold text-slate-200">"Quotes
                Forum"</div>

            <div class="container mx-auto text-center py-12">

                <div
                    class="flex flex-col md:flex-row items-start gap-12 max-w-6xl mx-auto">

                    <!-- images -->
                    <div class="flex flex-col gap-6">
                        <img id="image1"
                            class="w-[150px] h-[150px] border-2 border-slate-400"
                            src="shakespeare.png"
                            alt="Shakespeare">
                        <img id="image2"
                            class="w-[150px] h-[150px] border-2 border-slate-400"
                            src="thiru.png"
                            alt="Thiruvalluvar">
                        <img id="image3"
                            class="w-[150px] h-[150px] border-2 border-slate-400"
                            src="stevejobs.png"
                            alt="Steve Jobs">
                        <img id="image4"
                            class="w-[150px] h-[150px] border-2 border-slate-400"
                            src="bharathi.png"
                            alt="Bharathiyar">
                    </div>

                    <div class="flex flex-col gap-6">
                        <ul class="quote-list">

                        </ul>
                    </div>
                    <!-- quoted random -->
                    <div id="quote-box"
                        class>
                        <p id="quote-text"></p>
                        <p id="quote-author"></p>
                    </div>
                </div>

            </div>

            <div class="text-center">
                <a href="index.html" class="text-blue-600 hover:underline">⬅️
                    Back to Home</a>
            </div>
