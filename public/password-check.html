<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Game</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous" referrerpolicy="no-referrer" />
  </head>
  <body>
    <main class="bg-amber-100 flex justify-center min-h-screen items-center">
      <div>
        <img class="h-96 w-full" src="/password.png" />
      </div>
      <div class="bg-white m-8 px-8 py-8 rounded-xl shadow-lg ">
        <h1 class="text-2xl font-bold mb-4 text-center">Password Game 🔓</h1>
        
        <label class="text-sm text-gray-600 ml-2">Please create your password</label>
        <div
          class="container flex justify-center items-center rounded-full w-full p-2 border-2 border-gray-600 mb-4">
          
          <input type="password" id="input"
            class="flex-grow h-full outline-none px-2 "
            placeholder="Enter password">
          <i id="showPassword"
            class="fa-solid fa-eye hidden text-green-600"></i>
          <i id="hidePassword"
            class="fa-solid fa-eye-slash text-gray-400"></i>
        </div>

        <ul class="list-none space-y-2">
          <li id="eightCharacters" class="flex items-center gap-3">
            <svg class="checkIcon text-black w-5 h-5 hidden"
              xmlns="http://www.w3.org/2000/svg" width="16" height="16"
              viewBox="0 0 24 24"><path fill="green"
                d="m10.6 16.2l7.05-7.05l-1.4-1.4l-5.65 5.65l-2.85-2.85l-1.4 1.4zM3 21V3h18v18z" /></svg>Your password must be at least 8 characters</li>

          <li id="upperCase" class="flex items-center gap-3">
            <svg class="checkIcon text-black w-5 h-5 hidden"
              xmlns="http://www.w3.org/2000/svg" width="16" height="16"
              viewBox="0 0 24 24"><path fill="green"
                d="m10.6 16.2l7.05-7.05l-1.4-1.4l-5.65 5.65l-2.85-2.85l-1.4 1.4zM3 21V3h18v18z" /></svg>
           Include at least one uppercase letter</li>

          <li id="lowerCase" class="flex items-center gap-3">
            <svg class="checkIcon text-black w-5 h-5 hidden"
              xmlns="http://www.w3.org/2000/svg" width="16" height="16"
              viewBox="0 0 24 24"><path fill="green"
                d="m10.6 16.2l7.05-7.05l-1.4-1.4l-5.65 5.65l-2.85-2.85l-1.4 1.4zM3 21V3h18v18z" /></svg>Include at least one lowercase letter</li>

          <li id="number" class="flex items-center gap-3">
            <svg class="checkIcon text-black w-5 h-5 hidden"
              xmlns="http://www.w3.org/2000/svg" width="16" height="16"
              viewBox="0 0 24 24"><path fill="green"
                d="m10.6 16.2l7.05-7.05l-1.4-1.4l-5.65 5.65l-2.85-2.85l-1.4 1.4zM3 21V3h18v18z" /></svg>Include at least one number</li>

          <li id="specialCharacter" class="flex items-center gap-3">
            <svg class="checkIcon text-black w-5 h-5 hidden"
              xmlns="http://www.w3.org/2000/svg" width="16" height="16"
              viewBox="0 0 24 24"><path fill="green"
                d="m10.6 16.2l7.05-7.05l-1.4-1.4l-5.65 5.65l-2.85-2.85l-1.4 1.4zM3 21V3h18v18z" /></svg>nclude at least one special character (like !@#$%)</li>

        </ul>
      </div>


    </main>

    <script type="module" src="/src/password.js"></script>
  </body>
</html>
